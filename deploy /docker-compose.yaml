services:
  backend:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=database-1.cbu2iguumukf.ap-southeast-2.rds.amazonaws.com
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=Tuananh250106
      - DB_NAME=db_test
      - DB_SSLMODE=verify-full
      - refresh_secret_key=tuananh16
      - DB_SSLROOTCERT=/app/global-bundle.pem
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - rabbitMQ_url=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - ../global-bundle.pem:/app/global-bundle.pem
    depends_on:
      - redis-cache
      - rabbitmq

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
    - "80:80"
    depends_on:
    - backend

  redis-cache:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest